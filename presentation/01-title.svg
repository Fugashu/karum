<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#0f0f0f"/>
  <!-- Top accent line -->
  <rect x="0" y="0" width="1920" height="4" fill="#e8a832"/>
  <!-- Bottom accent line -->
  <rect x="0" y="1076" width="1920" height="4" fill="#e8a832"/>

  <!-- KARUM logo -->
  <text x="960" y="400" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="180" fill="#f0ece6" letter-spacing="0.14em">K<tspan fill="#e8a832">A</tspan>RUM</text>

  <!-- Tagline -->
  <text x="960" y="510" text-anchor="middle" font-family="sans-serif" font-size="42" fill="#b0aaa0" letter-spacing="0.08em">THE FRONTIER'S FIRST MARKETPLACE NETWORK</text>

  <!-- Divider -->
  <line x1="760" y1="570" x2="1160" y2="570" stroke="#333333" stroke-width="2"/>

  <!-- Subtitle -->
  <text x="960" y="640" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#706a60">Find resources. Compare prices. Trade on-chain.</text>

  <!-- Hackathon badge -->
  <rect x="735" y="750" width="450" height="60" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="960" y="790" text-anchor="middle" font-family="monospace" font-size="22" fill="#e8a832" letter-spacing="0.1em">EVE FRONTIER x SUI 2026</text>

  <!-- Theme -->
  <text x="960" y="920" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#706a60" letter-spacing="0.06em">A Toolkit for Civilization</text>
</svg>
