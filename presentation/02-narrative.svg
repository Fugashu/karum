<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#0f0f0f"/>
  <rect x="0" y="0" width="1920" height="4" fill="#e8a832"/>
  <rect x="0" y="1076" width="1920" height="4" fill="#e8a832"/>

  <!-- History block -->
  <text x="960" y="220" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="24" fill="#e8a832" letter-spacing="0.15em">4,000 YEARS AGO</text>

  <text x="960" y="310" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#f0ece6">Assyrian merchants built the Karum —</text>
  <text x="960" y="360" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#f0ece6">humanity's first organized trade network.</text>

  <text x="960" y="440" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#b0aaa0">Chains of marketplace colonies connected by caravan routes.</text>
  <text x="960" y="480" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#b0aaa0">Every transaction recorded on cuneiform clay tablets.</text>

  <!-- Divider -->
  <line x1="810" y1="550" x2="1110" y2="550" stroke="#333333" stroke-width="2"/>

  <!-- Present -->
  <text x="960" y="640" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="24" fill="#e8a832" letter-spacing="0.15em">NOW</text>

  <text x="960" y="720" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#f0ece6">The Frontier has resources, ships, and Smart Storage Units.</text>
  <text x="960" y="770" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#f0ece6">What it doesn't have is a marketplace.</text>

  <!-- Bottom line -->
  <rect x="460" y="880" width="1000" height="80" fill="#1c1c1c" stroke="#e8a832" stroke-width="2"/>
  <text x="960" y="930" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="28" fill="#f0ece6">We're rebuilding it <tspan fill="#e8a832">for the Frontier.</tspan></text>
</svg>
