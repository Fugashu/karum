<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <rect width="1920" height="1080" fill="#0f0f0f"/>
  <rect x="0" y="0" width="1920" height="4" fill="#e8a832"/>
  <rect x="0" y="1076" width="1920" height="4" fill="#e8a832"/>

  <!-- Section label -->
  <text x="960" y="80" text-anchor="middle" font-family="monospace" font-size="18" fill="#e8a832" letter-spacing="0.2em">HOW IT WORKS</text>

  <!-- Player box (top center) -->
  <rect x="760" y="120" width="400" height="80" fill="#1c1c1c" stroke="#f0ece6" stroke-width="2"/>
  <text x="960" y="170" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="24" fill="#f0ece6">PLAYER</text>
  <text x="960" y="145" text-anchor="middle" font-family="monospace" font-size="14" fill="#706a60">Browser / Mobile</text>

  <!-- Arrow down from player -->
  <line x1="960" y1="200" x2="960" y2="270" stroke="#f0ece6" stroke-width="2"/>
  <polygon points="950,265 960,280 970,265" fill="#f0ece6"/>

  <!-- KARUM Frontend box (center) -->
  <rect x="560" y="280" width="800" height="160" fill="#1c1c1c" stroke="#e8a832" stroke-width="3"/>
  <rect x="560" y="280" width="800" height="4" fill="#e8a832"/>
  <text x="960" y="330" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="32" fill="#e8a832" letter-spacing="0.08em">KARUM</text>
  <text x="960" y="365" text-anchor="middle" font-family="monospace" font-size="18" fill="#b0aaa0">React + Vite on Vercel</text>
  <text x="960" y="400" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#706a60">Browse shops: no wallet | Register shop: wallet required</text>
  <text x="960" y="425" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#706a60">Cross-references both data sources in real time</text>

  <!-- Arrow down-left to Sui -->
  <line x1="760" y1="440" x2="480" y2="540" stroke="#e8a832" stroke-width="2"/>
  <polygon points="472,532 475,548 490,538" fill="#e8a832"/>
  <text x="580" y="490" font-family="monospace" font-size="14" fill="#e8a832">Read/Write</text>

  <!-- Arrow down-right to Gateway -->
  <line x1="1160" y1="440" x2="1440" y2="540" stroke="#4ade80" stroke-width="2"/>
  <polygon points="1430,532 1445,548 1448,532" fill="#4ade80"/>
  <text x="1280" y="490" font-family="monospace" font-size="14" fill="#4ade80">Read Only</text>

  <!-- Sui Blockchain box (left) -->
  <rect x="160" y="540" width="640" height="380" fill="#1c1c1c" stroke="#e8a832" stroke-width="2"/>
  <rect x="160" y="540" width="640" height="4" fill="#e8a832"/>
  <text x="480" y="590" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="24" fill="#e8a832">SUI BLOCKCHAIN</text>

  <text x="220" y="640" font-family="monospace" font-weight="bold" font-size="18" fill="#f0ece6">ShopRegistry (shared object)</text>

  <text x="240" y="680" font-family="monospace" font-size="16" fill="#b0aaa0">register_shop()</text>
  <text x="240" y="710" font-family="monospace" font-size="16" fill="#b0aaa0">add_offer()</text>
  <text x="240" y="740" font-family="monospace" font-size="16" fill="#b0aaa0">update_price()</text>
  <text x="240" y="770" font-family="monospace" font-size="16" fill="#b0aaa0">deactivate_shop()</text>

  <line x1="200" y1="800" x2="760" y2="800" stroke="#333333" stroke-width="1"/>

  <text x="220" y="835" font-family="sans-serif" font-size="16" fill="#706a60">Stores: offers, prices, owner, active status</text>
  <text x="220" y="865" font-family="sans-serif" font-size="16" fill="#706a60">Read: Sui TS SDK | Write: wallet transaction</text>
  <text x="220" y="895" font-family="monospace" font-size="14" fill="#e8a832">Sui Move smart contract</text>

  <!-- EVE Gateway box (right) -->
  <rect x="1120" y="540" width="640" height="380" fill="#1c1c1c" stroke="#4ade80" stroke-width="2"/>
  <rect x="1120" y="540" width="640" height="4" fill="#4ade80"/>
  <text x="1440" y="590" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="24" fill="#4ade80">EVE FRONTIER GATEWAY</text>

  <text x="1180" y="640" font-family="monospace" font-weight="bold" font-size="18" fill="#f0ece6">Live SSU State</text>

  <text x="1200" y="680" font-family="monospace" font-size="16" fill="#b0aaa0">Online / Offline</text>
  <text x="1200" y="710" font-family="monospace" font-size="16" fill="#b0aaa0">Real inventory</text>
  <text x="1200" y="740" font-family="monospace" font-size="16" fill="#b0aaa0">Fuel level</text>
  <text x="1200" y="770" font-family="monospace" font-size="16" fill="#b0aaa0">Coordinates + solar system</text>

  <line x1="1160" y1="800" x2="1720" y2="800" stroke="#333333" stroke-width="1"/>

  <text x="1180" y="835" font-family="sans-serif" font-size="16" fill="#706a60">Stores: live game state from blockchain</text>
  <text x="1180" y="865" font-family="sans-serif" font-size="16" fill="#706a60">Read: REST API + GraphQL</text>
  <text x="1180" y="895" font-family="monospace" font-size="14" fill="#4ade80">Public, no auth required</text>

  <!-- Bottom bar -->
  <rect x="360" y="990" width="1200" height="50" fill="#1c1c1c" stroke="#333333" stroke-width="1"/>
  <text x="960" y="1023" text-anchor="middle" font-family="monospace" font-size="18" fill="#706a60">No backend. No database. Static frontend reads two public data sources.</text>
</svg>
